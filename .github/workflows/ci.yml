name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Also callable from publish.yml so a release gate re-runs the full
  # matrix against the tag ref before touching any registry.
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm sanity build
        run: cargo build --package pyde-host --target wasm32-unknown-unknown --release

  assemblyscript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assemblyscript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: assemblyscript/package-lock.json
      - name: install
        run: npm ci
      - name: compile
        run: npx asc assembly/index.ts --outFile /tmp/host-check.wasm --target release
      # Child-address conformance: preimage assembly + unordered-pair
      # sort replayed against the shared golden vectors.
      - name: conformance vectors
        run: npm test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin the host Go toolchain explicitly (the conformance step
      # below needs `go test`; don't depend on the runner image).
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: 'latest'
      # Child-address conformance: the pure `child` subpackage (no
      # wasmimport, so host `go test` works) replays the shared
      # golden vectors — preimage assembly + unordered-pair sort.
      - name: conformance vectors
        working-directory: go
        run: |
          go vet ./child
          go test ./child -v
      # TinyGo needs a main entry point; the pyde-host go package is
      # library-only. Build a tiny smoke program in a temp dir that
      # imports the library via a `replace` directive.
      - name: build smoke program
        run: |
          SMOKE=$(mktemp -d)
          cat > "$SMOKE/go.mod" <<EOF
          module smoke
          go 1.21
          require github.com/pyde-net/pyde-host/go v0.0.0
          replace github.com/pyde-net/pyde-host/go => $GITHUB_WORKSPACE/go
          EOF
          cat > "$SMOKE/main.go" <<'EOF'
          package main

          import _ "github.com/pyde-net/pyde-host/go"

          func main() {}
          EOF
          cd "$SMOKE" && tinygo build -target=wasi -o /tmp/host-check.wasm .

  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang + wasm-ld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 lld-17
          sudo ln -sf /usr/bin/clang-17 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-17 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/wasm-ld-17 /usr/local/bin/wasm-ld
      - name: C smoke build
        run: |
          cat > /tmp/main.c <<'EOF'
          #include <pyde/host.h>
          int main(void) { return 0; }
          EOF
          clang \
            --target=wasm32-unknown-unknown \
            -nostdlib \
            -Wl,--no-entry \
            -Wl,--export-all \
            -I c/include \
            -o /tmp/host-check.wasm \
            /tmp/main.c
      # Guards the `extern "C"` block that lets C++ include the header
      # without hitting name-mangling mismatches against the WASM host
      # import table. If someone removes the guards, this fails first.
      - name: C++ smoke build
        run: |
          cat > /tmp/main.cpp <<'EOF'
          #include <pyde/host.h>
          int main() { return 0; }
          EOF
          clang++ \
            --target=wasm32-unknown-unknown \
            -nostdlib \
            -Wl,--no-entry \
            -Wl,--export-all \
            -I c/include \
            -o /tmp/host-check-cpp.wasm \
            /tmp/main.cpp
      # Child-address conformance: regenerate the embedded vectors
      # from the shared JSON (must match the committed copy), then
      # host-compile + run the preimage/pair-sort test.
      - name: conformance vectors
        run: |
          python3 scripts/gen_c_vectors.py
          git diff --exit-code c/tests/vectors_gen.h
          cc -std=c11 -Wall -Wextra -Werror -I c/include \
            -o /tmp/pyde-child-test c/tests/child_test.c
          /tmp/pyde-child-test

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: check parity
        run: python3 scripts/check_parity.py
