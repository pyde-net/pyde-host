# scalar-store-as — acceptance contract manifest for @pyde-net/host.
# See https://book.pyde.network/companion/OTIGEN_BINARY_SPEC

[contract]
name        = "scalar-store-as"
version     = "0.1.0"
description = "Acceptance contract for @pyde-net/host (issue #9): sstore_scalar + sload_scalar round-trip."
type        = "contract"

[contract.lang]
language = "as"
output   = "build/contract.wasm"

[contract.lang.toolchain]
asc_version = "0.27.37"

[deploy]
gas_limit = 10_000_000
gas_price = "auto"

[network.default]
name = "devnet"

[network.devnet]
rpc_url  = "http://127.0.0.1:9933"
chain_id = 31337

[state]
schema = [
    { name = "value", type = "uint64" },
]

[functions.set]
attributes = ["entry"]
inputs     = ["uint64"]
outputs    = []

[functions.get]
attributes = ["entry", "view"]
inputs     = []
outputs    = ["uint64"]
